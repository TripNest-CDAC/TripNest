spring.application.name=tripnest-crud-service
server.port=8082

spring.datasource.url=jdbc:mysql://localhost:3306/tripnest
spring.datasource.username=root
spring.datasource.password=${TRIPNEST_DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

app.jwt.secret=${TRIPNEST_JWT_SECRET}
app.cors.allowed-origins=${TRIPNEST_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}

eureka.client.service-url.defaultZone=${TRIPNEST_EUREKA_URL:http://localhost:8761/eureka/}
eureka.client.healthcheck.enabled=true
