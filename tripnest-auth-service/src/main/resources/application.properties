spring.application.name=tripnest-auth-service
server.port=8081

spring.datasource.url=jdbc:mysql://localhost:3306/tripnest
spring.datasource.username=root
spring.datasource.password=${TRIPNEST_DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=true

app.jwt.secret=${TRIPNEST_JWT_SECRET}
app.jwt.expiration-seconds=3600

app.cors.allowed-origins=${TRIPNEST_CORS_ALLOWED_ORIGINS:http://localhost:5173}

eureka.client.service-url.defaultZone=${TRIPNEST_EUREKA_URL:http://localhost:8761/eureka/}
eureka.client.healthcheck.enabled=false
eureka.client.registry-fetch-interval-seconds=30
eureka.instance.lease-renewal-interval-in-seconds=30
eureka.instance.lease-expiration-duration-in-seconds=90
